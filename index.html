    <script>
      (function() {
        var isExtensionError = function(msg, filename, stack) {
          var combined = ((msg || '') + ' ' + (filename || '') + ' ' + (stack || '')).toLowerCase();
          return combined.indexOf('metamask') !== -1 ||
                 combined.indexOf('chrome-extension://') !== -1 ||
                 combined.indexOf('moz-extension://') !== -1 ||
                 combined.indexOf('safari-extension://') !== -1 ||
                 combined.indexOf('failed to connect to metamask') !== -1 ||
                 combined.indexOf('inpage.js') !== -1 ||
                 combined.indexOf('ethereum') !== -1;
        };
        window.addEventListener('unhandledrejection', function(event) {
          var r = event.reason;
          var msg = typeof r === 'string' ? r : (r && r.message ? r.message : '');
          var stack = r && r.stack ? r.stack : '';
          if (isExtensionError(msg, '', stack)) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
        window.addEventListener('error', function(event) {
          var msg = event.message || '';
          var filename = event.filename || '';
          var stack = (event.error && event.error.stack) ? event.error.stack : '';
          if (isExtensionError(msg, filename, stack)) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
  </head>
